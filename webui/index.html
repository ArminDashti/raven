<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3C3F41" />
    <meta name="description" content="Raven — report and track bugs" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raven" />
    <link rel="apple-touch-icon" href="/bugs/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/bugs/pwa-192.png" />
    <title>Raven</title>
    <style>
      .app-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
      }
      html.dark .app-splash {
        background: #2b2b2b;
      }
      html.needs-splash .app-splash {
        display: flex;
        animation: raven-splash-overlay 1s ease-out forwards;
      }
      .app-splash img {
        width: 168px;
        height: 168px;
        border-radius: 38px;
        animation: raven-splash-logo 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes raven-splash-logo {
        0% {
          opacity: 0;
          transform: scale(0.82);
        }
        35% {
          opacity: 1;
          transform: scale(1.05);
        }
        55% {
          transform: scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: scale(1.04);
        }
      }
      @keyframes raven-splash-overlay {
        0%,
        72% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
    <script>
      (function () {
        var THEME_KEY = 'raven-bug-theme'
        var LAST_OPEN_KEY = 'bug_report_last_open'
        var IDLE_MS = 30 * 60 * 1000
        try {
          var stored = localStorage.getItem(THEME_KEY)
          var dark = stored !== 'light'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var reduce =
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
          var now = Date.now()
          var last = parseInt(localStorage.getItem(LAST_OPEN_KEY) || '0', 10) || 0
          var needsSplash = !reduce && (!last || now - last >= IDLE_MS)
          document.documentElement.classList.toggle('needs-splash', needsSplash)
          localStorage.setItem(LAST_OPEN_KEY, String(now))
        } catch (_) {}
      })()
    </script>
  </head>
  <body class="min-h-screen bg-background text-foreground font-sans">
    <div id="app-splash" class="app-splash" aria-hidden="true">
      <img id="app-splash-logo" alt="Raven" />
    </div>
    <script>
      (function () {
        var splash = document.getElementById('app-splash')
        var img = document.getElementById('app-splash-logo')
        if (!splash || !img) return
        var dark = document.documentElement.classList.contains('dark')
        img.src = dark ? '/bugs/dark-theme-logo.png' : '/bugs/white-theme-logo.png'
        if (!document.documentElement.classList.contains('needs-splash')) {
          splash.remove()
          return
        }
        function drop() {
          if (splash && splash.parentNode) splash.remove()
          document.documentElement.classList.remove('needs-splash')
        }
        splash.addEventListener('animationend', function (e) {
          if (e.target === splash) drop()
        })
        window.setTimeout(drop, 1200)
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
